
name: Bell Link APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: BellLinkTracker_APK_Build_Package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f settings.gradle.kts -o -f settings.gradle
          test -d app

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BellLink-Android-APK
          path: BellLinkTracker_APK_Build_Package/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
